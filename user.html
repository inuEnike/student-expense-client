<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Tracker</title>
    <link href="./dist/styles/output.css" rel="stylesheet" />
    <script
      src="https://kit.fontawesome.com/14bfa6f5f3.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>

  <body class="bg-blue-800">
    <div class="">
      <div class="flex justify-center items-center my-10 h-full">
        <div class="flex flex-col justify-center text-[#edd6d6] items-center">
          <div class="userIcon my-3">
            <!-- Placeholder image with user initials -->
            <img
              src="https://ui-avatars.com/api/?name=John+Doe&size=128"
              alt="User Icon"
              class="w-32 h-32 rounded-full shadow-md"
            />
          </div>
          <div class="text-center">
            <p class="email my-5 text-lg font-semibold">
              Email: <span class="getEmail">example@email.com</span>
            </p>
            <p class="fullName my-5 text-lg font-semibold">
              Full Name: <span class="getfullName font-light">John Doe</span>
            </p>
            <p class="matno my-5 text-lg font-semibold">
              Matriculation Number:
              <span class="getmatno font-light">ESH223344556677</span>
            </p>
            <p class="coin my-5 text-lg font-semibold">
              Available Coin Balance:
              <span class="getcoin font-light">ESH223344556677</span>
            </p>
            <p class="dateJoined my-5 text-lg font-semibold">
              Date Joined:
              <span class="getdateJoined font-light">ESH223344556677</span>
            </p>
          </div>
          <div class="bg-white px-10 py-3 md:w-[30vw] mx-5 my-3 rounded-md">
            <h2 class="text-blue-600 font-bold">Set Pin</h2>
            <form class="form" method="post" action="">
              <input
                type="text"
                class="border pin border-blue-300 w-[100%] text-[#000] px-3 focus:outline-none my-3 py-3"
              />
              <button
                type="submit"
                class="bg-blue-500 btn py-3 px-10 rounded-md"
              >
                Submit
              </button>
            </form>
            <div class="">
              <p class="error text-red-500 text-sm"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div
      class="bottom-bar fixed w-full bottom-0 grid grid-cols-3 bg-slate-200 px-5 py-3 rounded-t-xl gap-4"
    >
      <a href="/" class="flex items-center flex-col">
        <i class="fa-solid fa-house text-lg text-blue-400"></i>
        <span class="ml-1 text-sm">Home</span>
      </a>

      <a href="/settings.html" class="flex items-center flex-col">
        <i class="fa-solid fa-gear text-lg text-blue-400"></i>
        <span class="ml-1 text-sm">Settings</span>
      </a>
      <a href="/about.html" class="flex items-center flex-col">
        <i class="fa-solid fa-question-circle text-lg text-blue-400"></i>
        <span class="ml-1 text-sm">About</span>
      </a>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        let token = localStorage.getItem("auth");
        const fetchLoggedInUser = async () => {
          let response = await axios.get(
            "https://student-expense-tracker-lewk.onrender.com/api/v1/auth/get-user",
            {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            }
          );

          const getEmail = (document.querySelector(".getEmail").innerHTML =
            response.data.email);
          const getfullName = (document.querySelector(
            ".getfullName"
          ).innerHTML = `${response.data.surname} ${response.data.firstname} ${response.data.lastname}`);
          const getmatno = (document.querySelector(".getmatno").innerHTML =
            response.data.matno);
          const getcoin = (document.querySelector(".getcoin").innerHTML =
            response.data.coin);
          const getdateJoined = (document.querySelector(
            ".getdateJoined"
          ).innerHTML = new Date(response.data.createdAt).toLocaleDateString());

          // Dynamically update the placeholder image
          const userIcon = document.querySelector(".userIcon img");
          userIcon.src = `https://ui-avatars.com/api/?name=${response.data.surname}+${response.data.firstname}&size=128`;
        };
        fetchLoggedInUser();
      });

      const handleSubmit = async (e) => {
        let token = localStorage.getItem("auth");

        e.preventDefault();

        // Reference to the button and error message elements
        const btn = document.querySelector(".btn");
        const errorElement = document.querySelector(".error");

        // Start loading state
        let loading = true;
        btn.innerHTML = "Loading...";

        // Get input values
        const pin = document.querySelector(".pin").value;

        if (!pin) {
          alert("Please fill in the field");
          loading = false;
          btn.innerHTML = "Submit";
          return;
        }

        try {
          // Make the API call
          const response = await axios.post(
            "https://student-expense-tracker-lewk.onrender.com/api/v1/auth/set-pin",
            {
              pin: pin,
            },
            {
              headers: { Authorization: `Bearer ${token}` },
            }
          );

          console.log(response);
        } catch (error) {
          console.error("Error logging in:", error);
          errorElement.innerHTML =
            error.response?.data?.errMessage || "An error occurred";
          setTimeout(() => {
            errorElement.innerHTML = ""; // Clear error message after 7 seconds
          }, 7500);
        } finally {
          // Reset loading state
          loading = false;
          btn.innerHTML = "Submit";
        }
      };

      // Attach event listener to the form
      const form = document.querySelector(".form");
      form.addEventListener("submit", handleSubmit);
    </script>
  </body>
</html>
